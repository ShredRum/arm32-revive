# ─────────────────────────────────────────────────────────────────────────────
# ab-port game profile — Angry Birds Seasons
# VERIFIED data only (aapt / apksigner / readelf / sha256sum).
# ─────────────────────────────────────────────────────────────────────────────
id           = "seasons"
title        = "Angry Birds Seasons"
status       = "shipped"        # shipped | in-progress | planned; boots, menu, Play and gameplay verified against the native reference
strategy     = "jit"

[apk]
package      = "com.rovio.angrybirdsseasons"
# The port keeps the ORIGINAL APK's version (the manifest is not
# rewritten), so these two are the reference value, not something
# the build applies.
version_name = "6.6.2"
version_code = 6620
min_sdk      = 16
# 22 as shipped by Rovio: Android 14+ refuses to install a package that
# targets below 24 ("INSTALL_FAILED_DEPRECATED_SDK_VERSION: App package must
# target at least SDK version 24, but found 22"). Raised to 26 -- the value the
# sibling titles (rio, space, star-wars) already use, so the platform
# behaviour delta is the one this codebase already ships.
target_sdk   = 26
original     = "original/angry-birds-seasons-6-6-2.apk"
signer_dn    = "O=Rovio Mobile Ltd, L=Helsinki, C=FI"
signer_sha256 = "3bf281705398004c6f8e4ba8426c3ba2490385c3aeaf6b05b6440396c6a1a50d"

[guest]
abi    = "armeabi-v7a"
lib    = "libAngryBirdsSeasonsFull.so"
size   = 8528904
sha256 = "8183b73d9e2873e0bd3c661acbfef7e6eeef40c3403916e98830f97a9e239baf"
md5    = "ab9e86a786a871e600e0450f935b083e"
# No GNU build-id note (only .note.gnu.gold-version): CheckGuestBuildId() LOUDs
# and continues; IsPinnedGuest() is false, so no Rio VAs/hooks apply.
build_id = "none"
imports  = 321      # undefined; 6 pending data (rio/space: 5)
init     = 143      # DT_INIT_ARRAY entries (572 B / 4); harness: 142 (one null)
# GNU libstdc++ is statically linked here (unlike rio/space libc++), so the
# guest calls the ARM32 kuser helper page: init #93 -> 0xffff0fa0 (barrier).

[host]
abi          = "arm64-v8a"
lib          = "libabhost.so"
jni_package  = "com.rovio.fusion"
jni_exports  = 72                # NOTE: includes HockeyAppWrapper (breakpad)
jni_onload   = 0x12c50c

[strip]
libs = ["libjs.so", "libadcolony.so"]

[tree]
smali_lib_name_orig = "AngryBirdsSeasonsFull"   # Gen.smali:16, verified at decode
smali_patch_verified = true
