# ─────────────────────────────────────────────────────────────────────────────
# ab-port game profile — Angry Birds Space HD
# VERIFIED data only (aapt / apksigner / readelf / sha256sum).
# ─────────────────────────────────────────────────────────────────────────────
id           = "space"
title        = "Angry Birds Space HD"
status       = "in_progress"   # loader stage passes; see JOURNAL.md
strategy     = "jit"

[apk]
package      = "com.rovio.angrybirdsspaceHD"
# The port keeps the ORIGINAL APK's version (the manifest is not
# rewritten), so these two are the reference value, not something
# the build applies.
version_name = "2.2.14"
version_code = 221400
min_sdk      = 16
target_sdk   = 26
original     = "original/angry-birds-space-hd-2-2-14.apk"
signer_dn    = "O=Rovio Mobile Ltd, L=Helsinki, C=FI"
signer_sha256 = "3bf281705398004c6f8e4ba8426c3ba2490385c3aeaf6b05b6440396c6a1a50d"

[guest]
abi    = "armeabi-v7a"
lib    = "libAngryBirdsSpace.so"
size   = 7341052
sha256 = "cc11a1e9d5d18cc04cd57a08802f03f2e5a5cd869f0e056d8ba92e695fb6b1ce"
# No GNU build-id note (only .note.gnu.gold-version): CheckGuestBuildId() LOUDs
# and continues. The *absence* of a build-id is a clean "not Rio" marker.
build_id = "none"
imports  = 314      # undefined; same pending-data set as Rio
init     = 67       # DT_INIT_ARRAY entries (rio: 54); harness: 67/67 clean

[host]
abi          = "arm64-v8a"
lib          = "libabhost.so"
jni_package  = "com.rovio.fusion"
jni_exports  = 62
network      = "offline"       # engine network: offline (default) | online; REVIEW R-005
jni_onload   = 0x0cec08   # returns JNI_VERSION_1_6 on the native harness

[strip]
libs = ["libjs.so", "libadcolony.so"]

[tree]
smali_lib_name_orig = "AngryBirdsSpace"   # EXPECTED; verify at first decode
smali_patch_verified = false
